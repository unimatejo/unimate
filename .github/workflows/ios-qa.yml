# Opens every screen of the app in an iPhone simulator and records screenshots, crashes and logs.
# Triggered by changing anything under qa/. Results go to the "qa-results" branch.
name: iOS QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['qa/**', '.github/workflows/ios-qa.yml']
permissions:
  contents: write
concurrency:
  group: ios-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: xcode-27
    timeout-minutes: 75
    defaults:
      run:
        shell: bash -eo pipefail {0}
        working-directory: app
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://slkfyblvpewlxrifzrhg.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1otcwSg3NdpjsEmXJWJO7g_yxdXR2xP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: mkdir -p ../out/shots && npm ci 2>&1 | tail -5
      - run: npx expo prebuild --platform ios --clean > ../out/prebuild.log 2>&1
      - run: cd ios && pod install > ../../out/pods.log 2>&1
      - name: Build for the simulator
        run: |
          xcodebuild -workspace ios/UniMate.xcworkspace -scheme UniMate -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO > ../out/xcodebuild.log 2>&1 \
            || { grep -E "error:" ../out/xcodebuild.log | head -40; exit 1; }
      - name: Walk every screen
        working-directory: .
        run: |
          set +e
          APP=$(ls -d app/build/Build/Products/Release-iphonesimulator/*.app)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')][-1])")
          echo "device $UDID" | tee out/summary.txt
          xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b > /dev/null
          xcrun simctl install $UDID "$APP"
          xcrun simctl spawn $UDID log stream --style compact --predicate 'process == "UniMate"' > out/device.log 2>&1 &
          alive() { pgrep -f "UniMate.app/UniMate" > /dev/null; }
          shot() { sleep "$2"; xcrun simctl io $UDID screenshot "$PWD/out/shots/$1.png" >> out/shots.log 2>&1; if alive; then echo "OK    $1 pid $(pgrep -f UniMate.app/UniMate | head -1)" | tee -a out/summary.txt; else echo "CRASH $1" | tee -a out/summary.txt; xcrun simctl launch $UDID jo.unimate.app > /dev/null; sleep 12; fi; }
          # first launch turns on right-to-left, second launch uses it
          xcrun simctl launch $UDID jo.unimate.app; sleep 15; xcrun simctl terminate $UDID jo.unimate.app; sleep 2
          xcrun simctl launch $UDID jo.unimate.app; shot 00-login 15
          xcrun simctl openurl $UDID "unimate://callback?token_hash=$(cat qa/token.txt)&type=magiclink"; shot 01-after-login 15
          i=2
          while read -r r; do [ -z "$r" ] && continue; xcrun simctl openurl $UDID "unimate://$r"; shot "$(printf %02d $i)-${r//\//-}" 7; i=$((i+1)); done < qa/routes.txt
          xcrun simctl openurl $UDID "unimate://"; shot 99-home-again 6
          mkdir -p out/crashes; cp ~/Library/Logs/DiagnosticReports/UniMate* out/crashes/ 2>/dev/null; ls out/crashes | tee -a out/summary.txt
          exit 0
      - name: Publish results
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/pub && cp -R out/. /tmp/pub/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }} $(date -u)" > /tmp/pub/RUN.txt
          cd /tmp/pub && git init -q && git checkout -q -b qa-results
          git -c user.name=ci -c user.email=ci@unimate.local add -A
          git -c user.name=ci -c user.email=ci@unimate.local commit -qm "qa ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa-results

# Checks which Mac runner images can start, and which Xcode versions they have.
name: Mac probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mac-probe.yml']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: ls -d /Applications/Xcode*.app; xcodebuild -version

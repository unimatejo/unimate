# Builds an unsigned UniMate .ipa for sideloading with your own certificate (Esign, Sideloadly, Scarlet...).
# Runs on every push to main that touches the app. The .ipa and the build log are pushed to the "builds" branch.
name: iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios-ipa.yml']
permissions:
  contents: write
concurrency:
  group: ios-ipa
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        shell: bash -eo pipefail {0}
        working-directory: app
    env:
      # The publishable key is meant to ship inside the app; access is enforced by RLS in the database.
      EXPO_PUBLIC_SUPABASE_URL: https://slkfyblvpewlxrifzrhg.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1otcwSg3NdpjsEmXJWJO7g_yxdXR2xP
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (the app needs Swift 6.2+)
        working-directory: .
        run: |
          mkdir -p out && ls -d /Applications/Xcode*.app > out/xcodes.txt; cat out/xcodes.txt
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $X" | tee -a out/xcodes.txt; sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version; swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci 2>&1 | tee ../out/npm.log | tail -20
      - name: Let expo-modules-jsi build with the Xcode on the runner (its sources target a newer Swift)
        run: sed -i '' 's/swiftLanguageModes: \[\.v6\]/swiftLanguageModes: [.v5]/' node_modules/expo-modules-jsi/apple/Package.swift && grep -n swiftLanguageModes node_modules/expo-modules-jsi/apple/Package.swift
      - run: npx expo prebuild --platform ios --clean 2>&1 | tee ../out/prebuild.log
      - name: Pods
        run: cd ios && pod install 2>&1 | tee ../../out/pods.log | tail -30
      - name: Build (Release, no signing)
        run: |
          ls ios
          xcodebuild -workspace ios/UniMate.xcworkspace -scheme UniMate -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > ../out/xcodebuild.log 2>&1 \
            || { grep -E "error:|\*\* BUILD" ../out/xcodebuild.log | head -80; tail -60 ../out/xcodebuild.log; exit 1; }
          tail -5 ../out/xcodebuild.log
      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app)
          test -f "$APP/main.jsbundle" || { echo "no JS bundle inside the app"; exit 1; }
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ../out/UniMate.ipa Payload
          ls -la ../out
      - name: Publish to the builds branch
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/pub && cp -R out/. /tmp/pub/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }} $(date -u)" > /tmp/pub/BUILD.txt
          cd /tmp/pub && git init -q && git checkout -q -b builds
          git -c user.name=ci -c user.email=ci@unimate.local add -A
          git -c user.name=ci -c user.email=ci@unimate.local commit -qm "build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
